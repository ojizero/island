---
services:
  liminal:
    container_name: liminal
    image: ghcr.io/ojizero/liminal:1.13.0
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_PATH: /data/liminal.db
      PHX_HOST: ${PHX_HOST:-lmnl.ojizero.dev}
      PHX_CHECK_ORIGINS: ${PHX_CHECK_ORIGINS:-}
      PORT: "4000"
      POOL_SIZE: ${POOL_SIZE:-5}
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      PUID: ${PUID:-911}
      PGID: ${PGID:-911}
      # The image defaults to Erlang distribution with a cookie that is
      # public in the image: anyone who reaches EPMD can run code.
      RELEASE_DISTRIBUTION: none
    # The image's healthcheck runs `bin/liminal pid`, an RPC that needs
    # distribution. Check that the HTTP port accepts connections instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
    volumes:
      - ./data:/data
    expose:
      - "4000"
    networks:
      - servicenet
    labels:
      - traefik.enable=true
      - traefik.http.routers.liminal.entrypoints=web-secure
      - traefik.http.routers.liminal.rule=Host(`lmnl.tn.ojizero.dev`) || Host(`lmnl.ojizero.dev`)
      - traefik.http.routers.liminal.service=liminal
      - traefik.http.services.liminal.loadbalancer.server.port=4000

networks:
  servicenet:
    name: servicenet
    external: true
