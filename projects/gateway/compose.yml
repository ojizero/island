# Discussion around autoconnecting to networks instead of sharing a
# network: https://github.com/traefik/traefik/issues/8010
#
# Alternatively we could do host networking mode, but this will enforce setting
# the Docker socket proxy on the host machine and would require firewall rules
# to protect, not a thing I want (could be viable if moving to normal
# non-proxied socket)
---
services:
  # Read-only Docker API for Traefik's Docker provider. Only Traefik uses it.
  # A new stack that needs Docker gets its own proxy with its own permissions.
  docker-proxy:
    container_name: traefik-docker-proxy
    image: linuxserver/socket-proxy:3.4.2-r0-ls89
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    read_only: true
    expose:
      - "2375"
    networks:
      - dockernet

  proxy:
    container_name: traefik
    image: traefik:v3.7.9
    restart: unless-stopped
    depends_on:
      - docker-proxy
      - errors
    env_file: .env
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro # static traefik configuration
      - ./config/dynamic.yml:/etc/traefik/dynamic.yml:ro # dynamic traefik configuration
      - ./config/acme.json:/etc/traefik/acme.json # TLS certificate storage
    ports:
      - 80:80/udp
      - 80:80/tcp
      - 443:443/udp
      - 443:443/tcp
    networks:
      - dockernet
      - servicenet
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=web-secure
      - traefik.http.routers.traefik.rule=Host(`traefik.tn.ojizero.dev`) || Host(`traefik.ln.ojizero.dev`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.middlewares.traefik-basic-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASS_HASH}
      - traefik.http.routers.traefik.middlewares=traefik-basic-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"

  errors:
    container_name: traefik-errors
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    volumes:
      - ./static/errors/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/errors:/usr/share/nginx/html:ro
    networks:
      - servicenet

networks:
  # Connects Traefik to the Docker socket proxy only. Internal, so the
  # proxy has no route out and no other container can reach it.
  dockernet:
    name: gateway-dockernet
    driver: bridge
    internal: true

  # Services managed behind Traefik must use this network
  # as an externally defined one in their configs.
  servicenet:
    name: servicenet
