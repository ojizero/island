# Keep this file UTF-8 encoded and use ASCII-only comments. Invalid bytes make
# Traefik exit at startup with "yaml: invalid leading UTF-8 octet".
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: ":443"
          scheme: https
  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: ojizero.dev
            sans:
              - "*.ojizero.dev"
              - "*.tn.ojizero.dev"
              - "*.ln.ojizero.dev"
              - "*.wn.ojizero.dev"
              # Nested Buzz communities (*.tn... covers buzz.tn..., not *.buzz.tn...).
              - "*.buzz.tn.ojizero.dev"

providers:
  docker:
    exposedByDefault: false
    endpoint: "tcp://docker-proxy:2375"
    network: servicenet
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  insecure: false
  dashboard: true
  disableDashboardAd: true

log:
  level: warn
  noColor: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: accounts@ojizero.tech
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
