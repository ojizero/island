---
services:
  postgres:
    container_name: forgejo-postgres
    profiles: [atlas]
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: ${FORGEJO_DB_USER}
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    volumes:
      - ./configs/postgres:/var/lib/postgresql
    networks:
      - forgejo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  forgejo:
    container_name: forgejo
    profiles: [atlas]
    image: codeberg.org/forgejo/forgejo:17.0.1
    restart: unless-stopped
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__DOMAIN: forge.ojizero.dev
      FORGEJO__server__ROOT_URL: https://forge.ojizero.dev/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__SSH_DOMAIN: ssh-forge.ojizero.dev
      FORGEJO__server__SSH_PORT: 22
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__security__GLOBAL_TWO_FACTOR_REQUIREMENT: admin
      FORGEJO__security__DISABLE_QUERY_AUTH_TOKEN: "true"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: ${FORGEJO_REVERSE_PROXY_TRUSTED_PROXIES}
      FORGEJO__api__ENABLE_SWAGGER: "false"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INSTALL_LOCK: ${FORGEJO_INSTALL_LOCK:-false}
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
    volumes:
      - ${FORGEJO_DATA_PATH:-./configs/forgejo/data}:/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "22"
      - "3000"
    networks:
      - servicenet
      - forgejo-db
      - forgejo-actions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.entrypoints=web-secure
      - traefik.http.routers.forgejo.rule=Host(`forge.tn.ojizero.dev`) || Host(`forge.ojizero.dev`)
      - traefik.http.routers.forgejo.service=forgejo
      - traefik.http.services.forgejo.loadbalancer.server.port=3000

  docker-dind:
    container_name: forgejo-dind
    profiles: [atlas]
    image: docker:29.9.2-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      # Atlas's kernel has no iptables raw table (CONFIG_IP_NF_RAW).
      DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
    # The API is a unix socket that only the runner mounts. A TCP listener
    # is reachable from Forgejo, job containers, and routed LAN hosts.
    # Atlas's kernel has no overlayfs, and /var/lib/docker is on btrfs.
    command:
      - dockerd
      - -H
      - unix:///run/dind/docker.sock
      - --group
      - ${PGID:-1000}
      - --storage-driver=btrfs
    volumes:
      - dind-socket:/run/dind
    # Job containers run inside dind: they need egress and must reach
    # Forgejo and the runner's cache proxy. Through dind they resolve only
    # dotted names, such as forgejo.forgejo-actions.
    networks:
      - forgejo-actions
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/dind/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  forgejo-runner:
    container_name: forgejo-runner
    profiles: [atlas]
    image: code.forgejo.org/forgejo/runner:13.2.1
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
    volumes:
      - ${FORGEJO_RUNNER_DATA_PATH:-./configs/runner/data}:/data
      - dind-socket:/run/dind
    networks:
      - forgejo-actions
    depends_on:
      docker-dind:
        condition: service_healthy
      forgejo:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - exec forgejo-runner daemon --config /data/config.yml

  # Sagittarius A* runs a second runner for jobs that Atlas's kernel 4.4
  # cannot run, such as zig builds that need statx.
  sagittarius-dind:
    container_name: sagittarius-dind
    profiles: [sagittarius-a]
    image: docker:29.9.2-dind-rootless
    restart: unless-stopped
    # dockerd runs as uid 1000 in its own user namespace, so a job that
    # escapes is not root on the host. Making that namespace needs
    # privileged.
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=unix:///run/user/1000/docker.sock"]
    volumes:
      - sagittarius-socket:/run/user
      - ./sagittarius-resolv.conf:/etc/resolv.conf:ro
    networks:
      - sagittarius-actions
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/user/1000/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  sagittarius-runner:
    container_name: sagittarius-runner
    profiles: [sagittarius-a]
    image: code.forgejo.org/forgejo/runner:13.2.1
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
    volumes:
      - ./configs/sagittarius-runner:/data
      - sagittarius-socket:/run/user
    # LAN DNS does not resolve *.tn names, and MagicDNS does not answer
    # containers. 100.64.0.2 is Atlas on the tailnet.
    extra_hosts:
      - forge.tn.ojizero.dev:100.64.0.2
    networks:
      sagittarius-actions:
        # Jobs cannot resolve container names, so the cache host is this IP.
        ipv4_address: 10.250.0.10
    depends_on:
      sagittarius-dind:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - exec forgejo-runner daemon --config /data/config.yml

networks:
  servicenet:
    name: servicenet
    external: true

  forgejo-db:
    name: forgejo-db
    driver: bridge
    internal: true

  forgejo-actions:
    name: forgejo-actions
    driver: bridge

  sagittarius-actions:
    name: sagittarius-actions
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.0.0/24

volumes:
  dind-socket:
  sagittarius-socket:
