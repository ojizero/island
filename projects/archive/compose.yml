---
x-data-target: &data-target /data

services:
  karakeep-web:
    container_name: karakeep-web
    image: ghcr.io/karakeep-app/karakeep:0.34.1
    restart: unless-stopped
    environment:
      DATA_DIR: *data-target
      MEILI_ADDR: http://karakeep-meilisearch:7700
      NEXTAUTH_URL: https://keep.ojizero.dev
      BROWSER_WEBSOCKET_URL: ws://karakeep-chrome:3000/chromium/playwright
    env_file:
      - .env
    # user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - type: bind
        source: ${DATA_VAULT_PATH:-/archive}/karakeep
        target: *data-target
    expose:
      - "3000"
    networks:
      - servicenet
      - archive-sphere
      - offline-sphere
    labels:
      - traefik.enable=true
      - traefik.http.routers.karakeep.entrypoints=web-secure
      - traefik.http.routers.karakeep.rule=Host(`keep.ojizero.dev`) || Host(`keep.tn.ojizero.dev`) || Host(`keep.ln.ojizero.dev`)
      - traefik.http.routers.karakeep.service=karakeep
      - traefik.http.services.karakeep.loadbalancer.server.port=3000

  karakeep-chrome:
    container_name: karakeep-chrome
    image: ghcr.io/browserless/chromium:v2.58.1
    restart: unless-stopped
    environment:
      - CONCURRENT=5
      - TIMEOUT=120000
      - QUEUED=10
      - HEALTH=true
    expose:
      - "3000"
    networks:
      - archive-sphere

  # PINNED: keep getmeili/meilisearch at v1.41.0 - do NOT bump when upgrading this stack.
  # Karakeep targets this exact version; a newer Meilisearch needs wiping data.ms + full reindex.
  # https://docs.karakeep.app/administration/troubleshooting#upgrading-meilisearch---migrating-the-meilisearch-db-version
  karakeep-meilisearch:
    container_name: karakeep-meilisearch
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    # user: ${PUID:-1000}:${PGID:-1000}
    environment:
      MEILI_NO_ANALYTICS: "true"
    env_file:
      - .env
    volumes:
      - ./meilisearch:/meili_data
    expose:
      - "7700"
    networks:
      - offline-sphere

  hister:
    container_name: hister
    image: ghcr.io/asciimoo/hister:v0.21.0
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HISTER__SERVER__ADDRESS: 0.0.0.0:4433
      HISTER__SERVER__BASE_URL: https://hister.tn.ojizero.dev
      HISTER__APP__USER_HANDLING: "true"
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - type: bind
        source: ${DATA_VAULT_PATH:-/archive}/hister
        target: /hister/data
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    expose:
      - "4433"
    networks:
      - servicenet
    labels:
      - traefik.enable=true
      - traefik.http.routers.hister.entrypoints=web-secure
      - traefik.http.routers.hister.rule=Host(`hister.tn.ojizero.dev`)
      - traefik.http.routers.hister.service=hister
      - traefik.http.services.hister.loadbalancer.server.port=4433
      # v0.18.0 and later refresh signed-in sessions even for public assets. A failed
      # refresh returns text/plain HTTP 500 and prevents the frontend loading.
      # Serve immutable assets without cookies to avoid that session write.
      - traefik.http.routers.hister-assets.entrypoints=web-secure
      - traefik.http.routers.hister-assets.rule=Host(`hister.tn.ojizero.dev`) && PathPrefix(`/_app/immutable/`)
      - traefik.http.routers.hister-assets.service=hister
      - traefik.http.routers.hister-assets.middlewares=hister-assets-no-cookie
      - traefik.http.middlewares.hister-assets-no-cookie.headers.customrequestheaders.Cookie=

networks:
  servicenet:
    name: servicenet
    external: true

  archive-sphere:
    name: archive-sphere
    driver: bridge

  offline-sphere:
    name: archive-offline-sphere
    driver: bridge
    internal: true
